# The lab and real-money servers' exact packages (every one, with its version), made from backend/requirements.txt
# on the laptop. A new requirement is added WITHOUT moving the existing pins (they stay what the servers run):
#   grep "==" deploy/lab-server/requirements.lock | sed 's/ .*//' > pins.txt
#   uv pip compile backend/requirements.txt -c pins.txt --python-platform aarch64-manylinux_2_28 --python-version 3.14
#       --only-binary :all: --no-header -o new.lock      (then drop the "-c pins.txt" comment lines)
# The same list resolves for x86_64 (checked 2026-10-23), so it fits either kind of server. --only-binary proves every
# package has a ready-built Linux wheel: the server never compiles anything. 2026-10-23: + anthropic (the copilot's
# Claude, decision A5) and its 7 helpers; nothing else changed.
